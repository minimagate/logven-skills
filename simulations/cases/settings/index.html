<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery settings</title>
<style>
:root { color-scheme: light dark; --paper:light-dark(#f7f6f3,#191b1e); --surface:light-dark(#fff,#24272b); --ink:light-dark(#24282e,#e7e9ec); --muted:light-dark(#59616d,#aab2bd); --line:light-dark(#d9dce0,#414851); --accent:light-dark(#255dc0,#8db2ff); --control-radius:6px; --panel-radius:12px; font:14px/1.45 system-ui,sans-serif; }
* { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); }
main { max-width:900px; margin:64px auto; padding:48px; } h1 { font-size:36px; margin:0 0 24px; } h2 { font-size:20px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:32px; padding:40px; margin:32px 0; }
.nested { border:1px solid var(--line); border-radius:32px; padding:32px; margin:24px 0; }
label { display:block; margin:24px 0; } input,select,button { font:inherit; border:1px solid var(--line); border-radius:var(--control-radius); padding:8px; color:inherit; background:var(--surface); }
input[type=email],select { display:block; width:100%; max-width:380px; margin-top:8px; }
button { background:var(--accent); color:var(--paper); cursor:pointer; } :focus-visible { outline:2px solid var(--accent); outline-offset:3px; } small { color:var(--muted); }
</style>
<main><h1>Delivery settings</h1><p>Choose when your team receives report notifications.</p>
<form action="#" method="get"><section class="card"><h2>Email notifications</h2><div class="nested">
<label for="recipient">Recipient email<input id="recipient" name="recipient" type="email" required value="team@example.test"></label>
<label for="frequency">Delivery frequency<select id="frequency" name="frequency"><option>Every day</option><option>Every week</option></select></label>
<small>All times follow your workspace time zone.</small></div>
<div class="nested"><label><input name="failures" type="checkbox" checked> Notify me about failed deliveries</label><small>Important failures remain visible in the activity page.</small></div></section>
<button type="submit">Save settings</button></form></main></html>
